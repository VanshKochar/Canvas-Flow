version: '3.8'

services:
  # ============================================================================
  # FRONTEND (React + Vite + Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: canvasflow_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - canvasflow_network

  # ============================================================================
  # BACKEND API & SOCKET.IO SERVER
  # ============================================================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: canvasflow_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/canvasflow_whiteboard
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=canvasflow_access_secret_production_key_387498
      - JWT_REFRESH_SECRET=canvasflow_refresh_secret_production_key_928374
      - NODE_ENV=production
    depends_on:
      - mongodb
      - redis
    networks:
      - canvasflow_network

  # ============================================================================
  # MONGODB DOCUMENT PERSISTENCE
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: canvasflow_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - canvasflow_network

  # ============================================================================
  # REDIS CACHE & SOCKET.IO ADAPTER
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: canvasflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - canvasflow_network

volumes:
  mongo_data:
  redis_data:

networks:
  canvasflow_network:
    driver: bridge

